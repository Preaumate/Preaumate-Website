<!doctype html>
<html lang="en">
	<head>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── FAVICON ─────────────────────────────────────────── -->
  <!-- Option A — SVG favicon (works in all modern browsers) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Option B — Multi-format set (use after generating from realfavicongenerator.net)
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#10b981" />
  <meta name="msapplication-TileColor" content="#020818" />
  -->

  <!-- ── THEME COLOR ─────────────────────────────────────── -->
  <!-- Controls the browser chrome color on mobile -->
  <meta name="theme-color" content="#020818" />

  <!-- ── SEO BASICS ──────────────────────────────────────── -->
  <!-- Fallback description — overridden per-page by react-helmet -->
  <meta name="description" content="Preaumate — Industrial Automation Consultancy. PLC programming, HMI/SCADA, IoT and AI integration. Siemens, Rockwell and CoDeSys specialists." />

  <!-- ── ROBOTS ──────────────────────────────────────────── -->
  <!-- Allow search engines to index and follow links -->
  <meta name="robots" content="index, follow" />

  <!-- ── OPEN GRAPH FALLBACK ─────────────────────────────── -->
  <!-- Overridden per-page by react-helmet, but good to have a default -->
  <meta property="og:site_name" content="Preaumate" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_GB" />

  <title>Preaumate</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
